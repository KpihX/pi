[project]
name = "pi-ear"
version = "0.1.0"
description = "π-ear: the streaming ear of π (state on disk, live, no batch)"
readme = "README.md"
authors = [
    { name = "KpihX", email = "kapoivha@gmail.com" }
]
requires-python = ">=3.12"
# Owned by uv. Never hand-edited: every addition goes through `uv add <pkg>` so
# that uv resolves the graph itself.
dependencies = [
    "numpy>=2.5.4",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
    "typer>=0.27.3",
]

# ---------------------------------------------------------------------------
# Optional hardware profiles. One accelerator backend per environment, never a
# mixture. Philosophy copied from the verified template, ~/Labs/Explore/lab/
# pyproject.toml; the package lists are reduced to what this POC actually needs.
# All three axes are EMPTY today, on purpose: the POC needs numpy +
# sherpa-onnx + typer and nothing else, and a 3 GB torch download for a phase we
# have not reached would be a lie told to uv. The three extras stay declared so
# the switch exists and the conflict set stays symmetric; the day the plasticity
# phase needs torch, it lands in xpu (Intel Arc iGPU, /dev/dri/renderD128) and
# the index binding at the bottom of this file activates by itself.
#
#   uv sync                base only: numpy + sherpa-onnx + typer  (today)
#   uv sync --extra xpu    + torch on the Intel Arc (when torch lands in xpu)
# ---------------------------------------------------------------------------
[project.optional-dependencies]
cpu = []
xpu = []
cuda = []

[project.scripts]
# The key must be QUOTED: TOML bare keys are ASCII-only ("invalid unquoted key,
# expected letters, numbers, `-`, `_"). A quoted key takes any Unicode.
"π-ear" = "π_ear:main"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# `name = "pi-ear"` above cannot become π, and that is not a preference: the
# packaging standard is ASCII-only, and uv says it outright.
#   error: invalid value 'π-ear' for '--name <NAME>': Not a valid package or
#   extra name: "π-ear". Names must start and end with a letter or digit and may
#   only contain -, _, ., and alphanumeric characters.
# The distribution name stays ASCII therefore, and this line is what makes the
# module π anyway: uv_build would otherwise look for `pi_ear/` derived from the
# distribution name.
module-name = "π_ear"

# ---------------------------------------------------------------------------
# Hardware resolution. `index-strategy = unsafe-best-match` is what makes the XPU
# wheels rank correctly against PyPI: without it, torch silently resolves to a
# CUDA build and the model ends up on the CPU. The three indexes are declared so
# the switch stays available; only the XPU binding is live, because torch is only
# a dependency of the xpu extra. Doctrine: k-ai/references/pyproject-hardware.md,
# template: ~/Labs/Explore/lab/pyproject.toml.
# ---------------------------------------------------------------------------
[tool.uv]
index-strategy = "unsafe-best-match"
conflicts = [
    [{ extra = "cpu" }, { extra = "xpu" }, { extra = "cuda" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# ---------------------------------------------------------------------------
# [tool.uv.sources] is deliberately INACTIVE while every extra is empty.
# uv refuses a source entry for a package that is not in the extra it names:
#   "Source entry for `torch` only applies to extra `xpu`, but `torch` was not
#    found under the `project.optional-dependencies` section for that extra."
# So the binding is kept here, commented rather than deleted, because it is the
# one line that decides which accelerator torch resolves to. The day torch lands
# in the xpu extra, uncomment this and put torch back in that list:
#
# [tool.uv.sources]
# torch = [{ index = "pytorch-xpu", extra = "xpu" }]
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ISC"]
ignore = [
    "E501",  # Line too long, handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # Re-exports without __all__
# B008 is a false positive for typer: `typer.Option()` / `typer.Argument()` in a
# signature default IS the library's idiom. Suppressed here, not globally.
"src/π_ear/cli.py" = ["B008"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "scipy>=1.18.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
